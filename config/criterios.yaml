# Criterios con los que se decide si una licitacion vale la pena.
# El panel los muestra en la pestana "Criterios". Es la "mente experta" del
# radar: aqui se explica por que sube o baja un proceso, y que revisar
# cuando se quiera agregar o quitar terminos.
#
# Los pesos reales viven en config/filtros.yaml y config/perfil.yaml; este
# archivo solo los explica.
#
# estado: activo | supuesto | sin_datos | pendiente

criterios:
  - titulo: "Objeto del proceso"
    como: "Se busca por familias de términos: núcleo (variadores, PLC), catálogo (material eléctrico, cable, breaker), líneas secundarias (luminarias, UPS, solar) y contexto (RETIE)."
    por_que: "Es el filtro principal: sin coincidencia de objeto, el proceso no entra."
    estado: activo

  - titulo: "Tipo de contrato"
    como: "Suma si es Suministros o Compraventa; resta si es un contrato de servicios."
    detalles:
      - "Resta si es Prestación de servicios, Consultoría, Interventoría, Seguros o Arrendamientos, salvo que el objeto diga «suministro de», «adquisición de» o «compra de»: la entidad llena el tipo y a veces se equivoca."
      - "Obra no resta aquí: se marca aparte como «requiere aliado»."
      - "Mantenimiento resta 20 puntos aunque venga como compraventa, salvo las mismas excepciones, y nunca pasa de «por revisar»."
    por_que: "Electroriente vende producto; los contratos de servicios casi nunca son para un distribuidor."
    estado: supuesto

  - titulo: "Modalidad"
    como: "Suma en mínima cuantía, selección abreviada (menor cuantía y subasta inversa) y licitación pública. Resta en «solicitud de información». La contratación directa se excluye."
    por_que: "Son las modalidades abiertas a ofertas; la directa suele llegar con proveedor definido."
    estado: supuesto

  - titulo: "Cuantía"
    como: "Resta si el valor está por debajo del mínimo útil (hoy 5 millones, definido por el área) o muy por encima de la capacidad. Sin valor publicado no resta: queda marcado para revisión."
    por_que: "Fuera de la capacidad financiera no se puede ganar; muy pequeño, no paga el esfuerzo."
    estado: supuesto

  - titulo: "Territorio"
    como: "Suma si la entidad está en Santander, Norte de Santander, Boyacá o Cesar."
    por_que: "Entrega, soporte y relación comercial son más fáciles cerca de Bucaramanga."
    estado: activo

  - titulo: "Entidad conocida"
    como: "Suma si la entidad está en la lista de compradores conocidos (EPM, Ecopetrol, ESSA, etc.)."
    por_que: "Los compradores recurrentes de material eléctrico y automatización repiten procesos."
    estado: activo

  - titulo: "Instalación o montaje"
    como: "Se marca «requiere aliado» si el contrato es de Obra o el objeto menciona construcción, obra civil, montaje o puesta en marcha. Resta 15 puntos y baja a «por revisar», no se pierde."
    por_que: "Electroriente instala con aliados: estos procesos solo sirven en unión temporal o consorcio."
    estado: activo

  - titulo: "Proceso abierto"
    como: "Solo se muestran procesos con apertura «Abierto» y, si SECOP publica la fecha de cierre, que no haya pasado. Los cerrados y vencidos se descartan."
    por_que: "Un proceso cerrado o vencido ya no admite ofertas."
    estado: activo

  - titulo: "Fecha de cierre"
    como: "SECOP la publica en cerca del 5 % de los procesos. Cuando la trae, la tarjeta muestra los días que faltan y se marca en rojo con 3 o menos. Si no, ábralo en SECOP."
    por_que: "Con menos de 5 días hábiles, una primera oferta difícilmente alcanza."
    estado: activo

  - titulo: "Códigos UNSPSC"
    como: "No puntúan: la mayoría de procesos los trae como «UNSPECIFIED» o poco confiables."
    por_que: "Sí importan para el RUP: la empresa solo puede presentarse si sus códigos inscritos cubren el objeto."
    estado: pendiente

  - titulo: "Requisitos habilitantes"
    como: "RUP, experiencia y capacidad financiera aún no se cruzan: faltan los documentos de la empresa."
    por_que: "Si falta un solo habilitante, la oferta no es válida."
    estado: pendiente

# Lo que se descarta de plano, antes de puntuar (se muestra en la pestana Criterios).
descarte:
  - "El proceso ya no está abierto, o SECOP lo marca cancelado, en evaluación, adjudicado o desierto."
  - "La fecha de cierre ya pasó."
  - "Es contratación directa (suele llegar con proveedor definido)."
  - "Contiene un término de la lista de ruido (interventoría, vigilancia, papelería…)."
  - "No menciona nada de lo que Electroriente vende: sin coincidencia no entra."

revision_semanal:
  - "Abra la pestaña 'Por revisar' y lea los primeros 10 a 15. Para cada uno pregúntese: ¿podríamos suministrar esto?"
  - "Si SÍ y no estaba en el Radar: anote qué palabra del objeto lo habría subido y agréguela a 'incluir' en config/filtros.yaml."
  - "Si NO (ruido): anote la palabra que lo hizo entrar y agréguela a 'excluir'."
  - "Si hay una familia de términos que nunca coincide en la tabla de arriba, probablemente sobra o está mal escrita."
  - "Una oportunidad real que el radar nunca mostró se descubre mirando SECOP a mano una vez al mes y comparando."
