# Documentos generales que la empresa debe tener para presentar cualquier
# licitacion. Lo que depende de cada proceso (garantia de seriedad, fichas
# tecnicas, acuerdo de consorcio, etc.) NO va aqui: se ve en cada pliego.
#
# El panel los muestra en la pestana "Documentos". Cada persona marca en el
# panel cuales ya tiene; esa marca se guarda en su navegador, no en este
# archivo.
#
# IMPORTANTE: esto es la lista habitual, no la lista de un proceso concreto.
# Los requisitos exactos y la vigencia de cada documento los define el pliego
# de cada licitacion. Antes de presentar, se contrasta con el pliego.
#
# Campos:
#   cuando:   siempre | segun_pliego | si_aplica
#   emite:    quien lo expide o firma
#   vigencia: tiempo tipico de validez (orientativo)
#   pendiente: id de config/pendientes.yaml relacionado, si existe
#   condicion: requiere_aliado -> solo se exige cuando la alerta lo marca asi
#   si_menciona: terminos que, si aparecen en el objeto del proceso, hacen
#              probable que el pliego pida este documento

categorias:

  - id: juridicos
    titulo: "Jurídicos"
    descripcion: "Demuestran que la empresa existe, quién la representa y que está al día."
    documentos:
      - id: carta_presentacion
        nombre: "Carta de presentación de la oferta"
        para_que: "Formaliza la oferta. Se usa el formato exacto que entrega la entidad."
        emite: "Representante legal (firma)"
        vigencia: "Se hace para cada proceso"
        cuando: siempre

      - id: existencia_representacion
        nombre: "Certificado de existencia y representación legal"
        para_que: "Prueba que la empresa existe y quién puede firmar por ella."
        emite: "Cámara de Comercio de Bucaramanga"
        vigencia: "El pliego fija la antigüedad máxima (suele ser de 30 a 90 días)"
        cuando: siempre

      - id: rup
        nombre: "RUP, Registro Único de Proponentes"
        para_que: "Acredita experiencia, capacidad financiera y códigos UNSPSC inscritos. Sin RUP vigente y en firme no hay oferta válida en la mayoría de procesos."
        emite: "Cámara de Comercio"
        vigencia: "Se renueva cada año"
        cuando: siempre
        pendiente: rup

      - id: rut
        nombre: "RUT"
        para_que: "Identificación tributaria de la empresa."
        emite: "DIAN"
        vigencia: "Debe estar actualizado"
        cuando: siempre

      - id: cedula_rl
        nombre: "Cédula del representante legal"
        para_que: "Identifica a quien firma la oferta."
        emite: "Registraduría"
        vigencia: "No vence"
        cuando: siempre

      - id: seguridad_social
        nombre: "Certificación de aportes a seguridad social y parafiscales"
        para_que: "Demuestra que la empresa está al día con salud, pensión, riesgos y parafiscales."
        emite: "Revisor fiscal o representante legal"
        vigencia: "El pliego define los meses a certificar (suele ser los últimos 6)"
        cuando: siempre

      - id: antecedentes_fiscales
        nombre: "Antecedentes fiscales"
        para_que: "Confirma que ni la empresa ni el representante están en el boletín de responsables fiscales."
        emite: "Contraloría General de la República"
        vigencia: "Corta; se descarga cerca de la fecha de cierre"
        cuando: siempre

      - id: antecedentes_disciplinarios
        nombre: "Antecedentes disciplinarios"
        para_que: "Confirma que no hay inhabilidades disciplinarias."
        emite: "Procuraduría General de la Nación"
        vigencia: "Corta; se descarga cerca de la fecha de cierre"
        cuando: siempre

      - id: antecedentes_judiciales
        nombre: "Antecedentes judiciales"
        para_que: "Confirma que no hay antecedentes penales del representante legal."
        emite: "Policía Nacional"
        vigencia: "Corta; se descarga cerca de la fecha de cierre"
        cuando: siempre


  - id: financieros
    titulo: "Financieros"
    descripcion: "Muestran que la empresa tiene la capacidad económica que pide el proceso."
    documentos:
      - id: estados_financieros
        nombre: "Estados financieros del último año, con notas"
        para_que: "Sustentan los indicadores de liquidez, endeudamiento y capital de trabajo."
        emite: "Contador y representante legal; revisor fiscal si aplica"
        vigencia: "Corte del último año fiscal"
        cuando: siempre
        pendiente: capacidad_financiera


  - id: experiencia
    titulo: "Experiencia"
    descripcion: "Prueban que la empresa ya ejecutó contratos parecidos al que se licita."
    documentos:
      - id: certificaciones_experiencia
        nombre: "Certificaciones de experiencia firmadas por los clientes"
        para_que: "Acreditan contratos ejecutados, con objeto, valor y fechas. En muchos procesos también dan puntaje."
        emite: "Cada cliente"
        vigencia: "No vencen, pero deben corresponder al objeto y al valor que pide el pliego"
        cuando: siempre
        pendiente: certificaciones_experiencia


  - id: tecnicos
    titulo: "Técnicos y comerciales"
    descripcion: "Describen lo que se ofrece y demuestran que cumple."
    documentos:
      - id: propuesta_economica
        nombre: "Propuesta económica en el formato de la entidad"
        para_que: "Es lo que se evalúa en precio. Cambiar el formato puede ser causal de rechazo."
        emite: "Electroriente"
        vigencia: "Se hace para cada proceso"
        cuando: siempre

  - id: garantias
    titulo: "Garantías y plataforma"
    descripcion: "Se tramitan con terceros y toman días, así que no se dejan para el final."
    documentos:
      - id: usuario_secop
        nombre: "Usuario de SECOP II habilitado para el representante legal"
        para_que: "La oferta se carga en la plataforma. Crear y habilitar el usuario toma días."
        emite: "Colombia Compra Eficiente (SECOP II)"
        vigencia: "Permanente"
        cuando: siempre
        pendiente: secop_usuario
