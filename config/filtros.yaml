# Reglas de filtrado del radar.
#
# COMO FUNCIONA, en tres pasos:
#   1. INCLUIR  -> si el texto del proceso contiene alguno de estos terminos, entra
#   2. EXCLUIR  -> si contiene alguno de estos, sale (aunque haya entrado)
#   3. PUNTUAR  -> se calcula una relevancia de 0 a 100 para ordenar
#
# Editar este archivo es la forma principal de afinar el sistema.
# Cada vez que una alerta sea ruido, agrega el termino a "excluir".
# Cada vez que se escape una oportunidad, agrega el termino a "incluir".

# ---------------------------------------------------------------
# PASO 1: terminos que hacen entrar un proceso
# Agrupados por familia. El grupo determina el puntaje base. Un grupo puede exigir varios terminos
# distintos con `minimo_terminos` (por defecto basta uno).
# ---------------------------------------------------------------
incluir:

  # Peso alto: es la especialidad declarada de la empresa
  nucleo:
    peso: 40
    terminos:
      - "variador de velocidad"
      - "variadores de velocidad"
      - "variador de frecuencia"
      - "variador"                  # la entidad suele escribir «variadores Yaskawa» o «variador frecuencia», sin «de»
      - "inversor de frecuencia"
      - "convertidor de frecuencia"
      - "automatizacion industrial"
      - "control de motores"
      - "arrancador suave"
      - "guardamotor"
      - "plc"
      - "control de procesos"
      - "tablero de control"

  # Peso medio alto: producto central del catalogo
  catalogo_principal:
    peso: 30
    terminos:
      - "material electrico"
      - "materiales electricos"
      - "suministro electrico"
      - "cable electrico"
      - "cables y alambres"
      - "conductores electricos"
      - "tablero electrico"
      - "tablero de distribucion"
      - "totalizador"
      - "breaker"
      - "interruptor automatico"
      - "protecciones electricas"
      - "canaleta"
      - "bornera"
      - "prensaestopa"

  # Peso medio: lineas reales del catalogo con mercado publico propio
  lineas_secundarias:
    peso: 25
    terminos:
      - "iluminacion led"
      - "luminaria"
      - "alumbrado publico"
      - "panel led"
      - "ups"
      - "estabilizador"
      - "calidad de energia"
      - "eficiencia energetica"
      - "panel solar"
      - "energia solar"
      - "fotovoltaico"
      - "pararrayos"
      - "apantallamiento"
      - "puesta a tierra"
      - "subestacion"
      - "media tension"
      - "baja tension"
      - "transformador"

  # Productos concretos del catalogo de la tienda en linea (2.945 productos, revisado el 5 oct 2026) que una
  # entidad pide con su nombre y que los grupos de arriba no cubrian. Cada termino es lo bastante especifico
  # para puntuar solo. Probados contra 61.474 procesos de 30 dias: sumaron 22 alertas, casi todas legitimas.
  catalogo_tienda:
    peso: 25
    terminos:
      - "contactor"
      - "seccionador"
      - "medidor de energia"
      - "interruptor termomagnetico"
      - "cargador de bateria"
      - "pinza amperimetrica"
      - "temporizador"
      - "tomacorriente"
      - "cable duplex"
      - "cable encauchetado"
      - "tubo led"
      - "bombillo led"
      - "reflector led"
      - "lampara led"
      - "fotocelda"
      - "cofre electrico"
      - "pulsador"
      - "rele termico"
      - "fuente de poder"

  # Palabras sueltas del catalogo: una sola aparece por casualidad (un «fusible» en la ficha de una incubadora,
  # una «lampara» UV de laboratorio). Solo cuentan cuando coinciden al menos dos, como en las listas de ferreteria
  # electrica («bombillos, interruptores y tomacorrientes»).
  catalogo_sueltos:
    peso: 25
    minimo_terminos: 2
    terminos:
      - "interruptor"
      - "rele"
      - "fusible"
      - "lampara"
      - "bombillo"
      - "reflector"
      - "cofre"
      - "clavija"
      - "regleta"
      - "cinta aislante"
      - "terminal"
      - "conector"
      - "caja de paso"

  # Marcas que vende la tienda. Una entidad que nombra la marca suele pedir producto de esa linea.
  marcas_catalogo:
    peso: 20
    terminos:
      - "schneider"
      - "legrand"
      - "leviton"
      - "sylvania"
      - "lovato"
      - "autonics"
      - "centelsa"
      - "procables"
      - "tesys"
      - "moeller"

  # Peso bajo: señal de sector, no de producto. Sirve combinado.
  contexto:
    peso: 10
    terminos:
      - "retie"
      - "retilap"
      - "ntc 2050"
      - "red electrica"
      - "instalacion electrica"
      - "mantenimiento electrico"

# ---------------------------------------------------------------
# PASO 2: terminos que sacan un proceso aunque haya entrado
# Esto es lo que evita que el area deje de mirar las alertas.
# ---------------------------------------------------------------
excluir:
  # No es el negocio
  - "interventoria"
  - "consultoria juridica"
  - "vigilancia"
  - "aseo y cafeteria"
  - "papeleria"
  - "combustible"
  - "transporte escolar"
  - "alimentacion escolar"
  - "dotacion de vestuario"
  - "poliza de seguros"
  - "electrodomestico"
  - "electrobisturi"
  - "electrocardiograf"
  # Ruido que entraba por una palabra suelta (canaleta de aguas, subestacion de telecomunicaciones)
  - "vertimientos"
  - "aguas lluvias"
  - "enlaces de datos"

# Estados del procedimiento en los que ya no se puede presentar oferta (el proceso sigue «Abierto»
# en los datos, pero esta cancelado, en evaluacion o con proveedor ya seleccionado).
excluir_estado:
  - "Cancelado"
  - "Seleccionado"
  - "Evaluación"
  - "Adjudicado"
  - "Desierto"

# Modalidades que no aplican o no interesan por ahora
excluir_modalidad:
  - "Contratación directa"   # suele venir con proveedor ya definido

# Tipos de contrato que requieren aliado. No se excluyen:
# se marcan aparte para revisar como union temporal.
marcar_union_temporal:
  tipos_contrato:
    - "Obra"
  terminos:
    - "construccion"
    - "obra civil"
    - "instalacion y puesta en marcha"
    - "montaje"

# ---------------------------------------------------------------
# PASO 3: ajustes de puntaje
# ---------------------------------------------------------------
puntaje:
  bono_territorio_prioritario: 15   # proceso en Santander y alrededores
  bono_entidad_conocida: 10         # entidades que ya compran este tipo de material
  penalizacion_fuera_de_cuantia: -40
  umbral_alerta: 30                 # por debajo de esto no se notifica
  penalizacion_requiere_aliado: -15 # obra/montaje: solo sirve en union temporal
  umbral_revisar: 5                 # entre este y el de alerta: "por revisar"

# Niveles de factibilidad segun el puntaje final
niveles:
  alta: 50
  media: 30                         # debajo de esto (y desde umbral_revisar): por revisar

# ---------------------------------------------------------------
# Ajustes por tipo de contrato y modalidad (valores exactos de SECOP).
# Son supuestos de negocio para calibrar con el area, no datos.
# ---------------------------------------------------------------
ajustes_contrato:
  favorables:
    bono: 15
    tipos: ["Suministros", "Compraventa"]       # lo que Electroriente hace
  desfavorables:
    penalizacion: -15
    # El tipo de contrato lo diligencia la entidad y a veces viene mal (un
    # suministro marcado como "Servicios financieros"). Si el objeto dice
    # claramente que compra bienes, no se penaliza.
    salvo_si_menciona: ["suministro de", "suministro e", "suministros de", "adquisicion de", "compra de", "compraventa de"]
    tipos: ["Prestación de servicios", "Consultoría", "Interventoría", "Seguros",
            "Arrendamiento de inmuebles", "Arrendamiento de muebles",
            "Servicios financieros", "Comodato"]

  # Mantenimiento y reparacion son servicios aunque la entidad marque "Compraventa".
  # Restan salvo que el objeto diga que compra bienes (suministro de, adquisicion de...).
  # Aqui NO vale "suministro e instalacion": eso es obra menor dentro de un mantenimiento.
  mantenimiento:
    penalizacion: -20
    tope_puntaje: 29                # y nunca pasa de "por revisar" (debajo del nivel media)
    terminos: ["mantenimiento"]
    salvo_si_menciona: ["suministro de", "suministros de", "adquisicion de", "compra de", "compraventa de"]

ajustes_modalidad:
  favorables:
    bono: 10
    modalidades: ["Mínima cuantía", "Selección Abreviada de Menor Cuantía",
                  "Selección abreviada subasta inversa", "Licitación pública"]
  solo_informacion:
    penalizacion: -10               # piden información, no ofertas
    modalidades: ["Solicitud de información a los Proveedores"]

entidades_conocidas:
  - "EMPRESAS PUBLICAS DE MEDELLIN"
  - "EMPRESAS MUNICIPALES DE CALI"
  - "ECOPETROL"
  - "CENIT"
  - "ELECTRIFICADORA DE SANTANDER"
  - "ESSA"

# ---------------------------------------------------------------
# Codigos UNSPSC. Red ancha, independiente de como redacte la entidad.
# PENDIENTE: ampliar esta lista revisando el buscador UNSPSC de SECOP.
# Formato: codigo de familia a 6 digitos + 00
# ---------------------------------------------------------------
unspsc:
  - "26111700"  # Equipo de distribucion y control electrico
  - "26111600"  # Generadores y equipo de energia
  - "39121000"  # Componentes de distribucion electrica
  - "39121500"  # Cajas y tableros electricos
  - "26121600"  # Cables electricos
  - "39101600"  # Lamparas y bombillas
  - "39111500"  # Iluminacion interior
  - "39111600"  # Iluminacion exterior y alumbrado publico
  - "41111900"  # Instrumentos de medicion electrica
  - "40101700"  # Control industrial
