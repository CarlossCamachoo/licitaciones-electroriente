<div id="acceso" role="dialog" aria-modal="true" aria-labelledby="acceso-titulo">
  <form id="acceso-form" autocomplete="on">
    <div class="acceso-barra"><img src="logo.webp" alt="Electroriente" width="218" height="56"></div>
    <div class="acceso-cuerpo">
      <h1 id="acceso-titulo">Radar de Licitaciones</h1>
      <p>Esta página es privada. Escriba la contraseña que le dio el equipo de licitaciones.</p>
      <label for="acceso-clave">Contraseña</label>
      <input id="acceso-clave" type="password" autocomplete="current-password" required>
      <label class="acceso-recordar"><input id="acceso-recordar" type="checkbox"> Recordarme en este equipo</label>
      <p id="acceso-error" role="alert" hidden></p>
      <button id="acceso-entrar" type="submit">Entrar</button>
      <p class="acceso-nota">Los datos viajan cifrados: sin la contraseña no se pueden leer. Por seguridad, la contraseña se vuelve a pedir tras 6 horas sin usar la página.</p>
    </div>
  </form>
</div>
