name: Vigilante de licitaciones de Santander

# Busca en SECOP II cada 30 minutos y avisa por correo de las alertas nuevas de
# Santander, aunque el computador de la empresa este apagado. El aviso es una issue en este
# repositorio: GitHub la envia por correo al dueño y la muestra en su campana de GitHub.
# Horario: de 6:00 p. m. a 7:00 a. m. hora de Colombia (UTC-5), todos los dias, que es cuando el
# computador de la empresa suele estar apagado. Durante el dia basta con el panel.
# En UTC: 23:00-11:59 cada 30 minutos y las 12:00 (= 7:00 a. m.).
# Cada ejecucion dura menos de 1 minuto facturado: unas 800 al mes, dentro del cupo gratuito
# (2.000 min) de un repositorio privado.
on:
  schedule:
    - cron: "*/30 23,0-11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Crear una issue de prueba para comprobar que llega el correo"
        type: boolean
        default: false

concurrency:
  group: vigilante
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Recuerda que alertas ya se avisaron. Cada ejecucion guarda su version y la
      # siguiente recoge la mas reciente.
      - uses: actions/cache@v4
        with:
          path: data/vistos_nube.json
          key: vistos-${{ github.run_id }}
          restore-keys: vistos-
      - run: python src/vigilante_nube.py ${{ inputs.prueba && '--prueba' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
