name: Publicar la web compartida

# Genera la version compartida del panel (con contrasena) y la publica en el repositorio
# publico "radar-licitaciones" (GitHub Pages). Los datos van cifrados: el sitio es publico pero
# sin la contrasena no se puede leer nada. No incluye los documentos de la empresa.
# Horario: cada 2 horas, de 6:00 a. m. a 6:00 p. m. hora de Colombia (UTC-5) = 11, 13, 15, 17, 19, 21 y 23 UTC.
# (Una ejecucion normal dura ~2 min; la que rehace mercado y periodos largos, una vez al dia, ~11 min.
# Con el vigilante nocturno el total mensual queda dentro del cupo gratuito de 2.000 minutos.)
# La contrasena es el secreto CLAVE_WEB (se cambia con `gh secret set CLAVE_WEB`).
# La hoja compartida del equipo (Google Sheets) usa los secretos HOJA_URL y HOJA_TOKEN.
# Tambien se publica sola al subir cambios al codigo, la configuracion o la pantalla.
on:
  schedule:
    - cron: "0 11,13,15,17,19,21,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "web/**"
      - "requirements-publicar.txt"
      - ".github/workflows/publicar.yml"

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITIO: CarlossCamachoo/radar-licitaciones

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-publicar.txt
      - run: pip install -r requirements-publicar.txt
      # Mercado y competencia se reconstruyen una o dos veces al dia: aqui se conservan entre ejecuciones.
      - uses: actions/cache@v4
        with:
          path: |
            data/mercado.json
            data/competencia.json
          key: mercado-${{ github.run_id }}
          restore-keys: mercado-
      - name: Preparar acceso al sitio publico
        env:
          SITIO_DEPLOY_KEY: ${{ secrets.SITIO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SITIO_DEPLOY_KEY" > ~/.ssh/sitio
          chmod 600 ~/.ssh/sitio
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/sitio -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
      - name: Bajar el sitio actual
        run: git clone --depth 1 "git@github.com:${SITIO}.git" sitio
      - name: Generar la web cifrada
        env:
          CLAVE_WEB: ${{ secrets.CLAVE_WEB }}
          HOJA_URL: ${{ secrets.HOJA_URL }}
          HOJA_TOKEN: ${{ secrets.HOJA_TOKEN }}
        run: python src/publicar.py --destino sitio
      - name: Publicar
        run: |
          cd sitio
          rm -rf .git
          git init -q -b main
          git config user.name "Publicador del radar"
          git config user.email "publicador@users.noreply.github.com"
          git add -A
          git commit -q -m "Actualización $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "git@github.com:${SITIO}.git"
          # Un solo commit cada vez: los datos cifrados cambian siempre y no deben acumular historial.
          git push -q --force origin main
