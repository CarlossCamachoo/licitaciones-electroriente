name: Reintentar publicacion fallida

# Si "Publicar la web compartida" falla (por ejemplo, GitHub no asigna servidor o da un error
# interno), la relanza una sola vez a los 2 minutos. Sin esto, la web esperaria al siguiente
# disparo del reloj (30 minutos). Solo reintenta el primer intento: no puede entrar en bucle.
on:
  workflow_run:
    workflows: ["Publicar la web compartida"]
    types: [completed]

permissions:
  actions: write

jobs:
  reintentar:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Esperar y relanzar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 120
          gh run rerun "${{ github.event.workflow_run.id }}" --failed
